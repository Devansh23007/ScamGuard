<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { width: 280px; font: 13px/1.5 Arial, sans-serif; margin: 0; padding: 14px; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
  #status { padding: 8px 10px; border-radius: 6px; background: #eee; }
  #status.ok { background: #e6f4ea; color: #137333; }
  #status.bad { background: #fce8e6; color: #c5221f; }
  code { background: #f1f3f4; padding: 1px 4px; border-radius: 3px; }
  small { color: #5f6368; }
</style></head>
<body>
  <h1>🛡️ ScamGuard</h1>
  <div id="status">Checking server…</div>
  <div class="row"><label for="on">Scan my Gmail</label><input type="checkbox" id="on"></div>
  <small>Runs on mail.google.com. Emails are analysed by your local server only.</small>
  <script src="popup.js"></script>
</body></html>
